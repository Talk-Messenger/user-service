# в открытом виде. В prod обязательно задайте JWT_PRIVATE_KEY / JWT_PUBLIC_KEY.
jwt.keys.private-key=${JWT_PRIVATE_KEY:MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgv/p1NpJmKYDLnfnVfBKyx/D4bBN5WxPooVAZALiU+rGhRANCAATaNtTOuwKnJxGkOhhnMPfgeb1NtvrrBd8hTT+v0lEkBwrfqo0YXyAEstGYvmAsxCfrMJy+lhr8NBIeUOyHVXr0}
jwt.keys.public-key=${JWT_PUBLIC_KEY:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2jbUzrsCpycRpDoYZzD34Hm9Tbb66wXfIU0/r9JRJAcK36qNGF8gBLLRmL5gLMQn6zCcvpYa/DQSHlDsh1V69A==}

jwt.expiration.access-expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.expiration.refresh-expiration=${JWT_REFRESH_EXPIRATION:864000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

server.port=${APP_PORT:8080}

management.endpoint.health.show-details=always

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:user}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Читаем сырую строку: JSON разбираем сами, чтобы контролировать отправку в DLT
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# OpenAPI / Swagger UI. В prod документацию можно выключить переменными окружения.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:true}
springdoc.default-produces-media-type=application/json
springdoc.show-actuator=false

# Топики входящих событий AuthService (ТЗ п. 10.3).
# ВНИМАНИЕ: контракт AuthUserDeleted предположительный — согласовать имя топика
# и структуру payload с командой AuthService.
kafka.topics.auth-user-created=${KAFKA_TOPIC_AUTH_USER_CREATED:auth.user.created}
kafka.topics.auth-user-deleted=${KAFKA_TOPIC_AUTH_USER_DELETED:auth.user.deleted}
